[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "balc-flights-led"
version = "0.1.0"
description = "Show the nearest Seattle Balc flight on a Raspberry Pi MAX7219 or HUB75 matrix"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["raspberry-pi", "max7219", "hub75", "led-matrix", "adsb", "flight-tracking"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Topic :: System :: Hardware",
]
dependencies = [
    "luma.led_matrix>=1.7.1,<2",
    "spidev>=3.6,<4; platform_system == 'Linux'",
]

[project.urls]
Homepage = "https://github.com/TrumanBrown/balcFlights-LED"
Issues = "https://github.com/TrumanBrown/balcFlights-LED/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.12,<1",
]
recovery = [
    "RPi.GPIO>=0.7.1,<0.8",
]

[project.scripts]
balc-flights-led = "balc_flights_led.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["reference"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]