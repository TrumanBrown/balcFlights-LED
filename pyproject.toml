[build-system]
requires = ["setuptools>=66", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "balc-flights-led"
version = "0.1.0"
description = "Show the nearest Seattle Balc flight on a Raspberry Pi MAX7219 matrix"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "luma.led_matrix>=1.7.1,<2",
    "spidev>=3.6,<4; platform_system == 'Linux'",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.12,<1",
]
recovery = [
    "RPi.GPIO>=0.7.1,<0.8",
]

[project.scripts]
balc-flights-led = "balc_flights_led.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]