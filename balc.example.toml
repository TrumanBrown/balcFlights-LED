[location]
# Public center of the Seattle Balc API's default monitoring bounds.
latitude = 47.6175
longitude = -122.305
search_radius_nautical_miles = 20.0
# Inside this radius an aircraft counts as overhead: it gets the arrival
# animation, and its bearing arrow blinks.
overhead_radius_nautical_miles = 1.5

[api]
endpoint = "https://seattlebalc.com/api/v1/flights"
timeout_seconds = 10.0
# The API advertises max-age=20, so this is as often as polling is welcome.
# Positions are extrapolated locally between polls, so the display stays live.
refresh_seconds = 20.0
maximum_seen_seconds = 60.0
last_known_ttl_seconds = 300.0

[display]
# console, matrix, or both
renderer = "console"
# Which physical display 'matrix' means: max7219 (32x8 chain) or hub75 (RGB panel)
panel = "max7219"
# atari and tiny are the only fonts narrow enough for a full callsign
font = "atari"
page_seconds = 2.0
scroll_delay = 0.04
frame_seconds = 0.03
animations = true
# Plot every aircraft in range on a radar instead of paging through one at a
# time. HUB75 only; the MAX7219 chain has nowhere to put a dial.
radar = true
# How much sky the dial covers. 0 follows the search radius, which squeezes the
# whole search box into a 20-pixel radius and reads as noise.
radar_range_nautical_miles = 10.0
# Contacts plotted, nearest first. 0 plots every one of them.
radar_contacts = 6

# Used when display.panel = "max7219"
[matrix]
spi_port = 0
spi_device = 0
spi_speed_hz = 500000
cascaded = 4
block_orientation = -90
rotate = 0
reverse_order = false
contrast = 64

# Used when display.panel = "hub75". Defaults match the Waveshare
# RGB-Matrix-P2.5-64x64 wired straight to the Pi GPIO header.
[hub75]
rows = 64
columns = 64
chain_length = 1
parallel = 1
# regular for direct wiring, adafruit-hat or adafruit-hat-pwm for that HAT
hardware_mapping = "regular"
# 4 suits a Pi 4; lower it for a faster refresh, raise it if rows ghost or flicker
gpio_slowdown = 4
pwm_bits = 11
pwm_lsb_nanoseconds = 130
brightness = 50
limit_refresh_rate_hz = 0
led_rgb_sequence = "RGB"
# "", FM6126A, or FM6127. Only needed if the panel never lights up at all.
panel_type = ""
pixel_mapper_config = ""
# true trades picture stability for not needing onboard audio blacklisted
disable_hardware_pulsing = false
# Keep true: the driver needs root to start, then drops back to an unprivileged user
drop_privileges = true